# =============================================================================
# Hyprlock Configuration (Everforest Minimalist Glass with User Switcher)
# =============================================================================

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/simple/Pictures/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.89
    brightness = 0.72
    vibrancy = 0.22
    vibrancy_darkness = 0.1
}

# Avatar image
image {
    monitor =
    path = /home/simple/.face.png
    size = 100
    rounding = -1
    border_size = 2
    border_color = rgba(127, 187, 179, 0.75)
    position = 0, 70
    halign = center
    valign = center
}

# User greeting
label {
    monitor =
    text = $USER
    color = rgb(211, 198, 170)
    font_size = 18
    font_family = Inter SemiBold
    position = 0, 0
    halign = center
    valign = center
}

# Password input field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(127, 187, 179, 0.7)
    inner_color = rgba(20, 26, 26, 0.85)
    font_color = rgb(211, 198, 170)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 24
    check_color = rgba(167, 192, 128, 0.9)
    fail_color = rgba(230, 126, 128, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(230, 126, 128, 0.9)
    numlock_color = rgba(167, 192, 128, 0.9)
    position = 0, -60
    halign = center
    valign = center
}

# Time (Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(211, 198, 170)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 230
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(211, 198, 170, 0.75)
    font_size = 16
    font_family = Inter Medium
    position = 0, 175
    halign = center
    valign = center
}

# Switch to david (direct click button)
label {
    monitor =
    text = 󰍂  Switch to david
    color = rgba(127, 187, 179, 0.85)
    font_size = 13
    font_family = Inter Medium
    position = 0, -125
    halign = center
    valign = center
    onclick = python3 /home/simple/.config/hypr/scripts/switch_user.py david
}

# Switch User / Change Account button (bottom pill)
label {
    monitor =
    text = 👥  Switch User (Other Accounts)
    color = rgba(133, 146, 137, 0.75)
    font_size = 12
    font_family = Inter
    position = 0, 42
    halign = center
    valign = bottom
    onclick = python3 /home/simple/.config/hypr/scripts/switch_user.py
}
