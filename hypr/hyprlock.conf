background {
    monitor =
    path = /home/david/Pictures/wallpaper.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(127, 187, 179, 0.8)
    inner_color = rgba(22, 28, 28, 0.85)
    font_color = rgb(211, 198, 170)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##707880">Enter Password...</span></i>
    hide_input = false
    rounding = 16
    check_color = rgba(167, 192, 128, 0.8)
    fail_color = rgba(230, 126, 128, 0.8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(211, 198, 170)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(211, 198, 170, 0.75)
    font_size = 18
    font_family = Inter Medium
    position = 0, 30
    halign = center
    valign = center
}
