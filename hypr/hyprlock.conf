# =============================================================================
# Hyprlock Configuration (Everforest Minimalist Glass)
# =============================================================================


background {
    monitor =
    path = /home/simple/Pictures/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.89
    brightness = 0.72
    vibrancy = 0.22
    vibrancy_darkness = 0.1
}

# Avatar image
image {
    monitor =
    path = /home/simple/.face.png
    size = 100
    rounding = -1
    border_size = 2
    border_color = rgba(127, 187, 179, 0.75)
    position = 0, 60
    halign = center
    valign = center
}

# User greeting
label {
    monitor =
    text = $USER
    color = rgb(211, 198, 170)
    font_size = 17
    font_family = Inter SemiBold
    position = 0, -8
    halign = center
    valign = center
}

# Password input field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(127, 187, 179, 0.7)
    inner_color = rgba(20, 26, 26, 0.85)
    font_color = rgb(211, 198, 170)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 24
    check_color = rgba(167, 192, 128, 0.9)
    fail_color = rgba(230, 126, 128, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -68
    halign = center
    valign = center
}

# Time (Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(211, 198, 170)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(211, 198, 170, 0.75)
    font_size = 16
    font_family = Inter Medium
    position = 0, 165
    halign = center
    valign = center
}

# Switch User helper
label {
    monitor =
    text = 󰍂  Press Ctrl + Alt + S to Switch User
    color = rgba(133, 146, 137, 0.65)
    font_size = 12
    font_family = Inter
    position = 0, 36
    halign = center
    valign = bottom
}
