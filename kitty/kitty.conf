font_family      JetBrainsMono Nerd Font
font_size        11.0
background_opacity 0.88
background_blur  20
window_padding_width 14

# Open as a comfortable floating window instead of the last (tiled) size
remember_window_size no
initial_window_width  110c
initial_window_height 32c

shell /bin/bash

background #1e2524
foreground #d3c6aa
selection_background #343f44
color0  #273433
color1  #e67e80
color2  #a7c080
color3  #dbbc7f
color4  #7fbbb3
color5  #d699b6
color6  #83c092
color7  #d3c6aa

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 1
tab_title_template " {fmt.fg.red}● {fmt.fg.yellow}● {fmt.fg.green}●  {fmt.fg.default}{title} "
active_tab_background #141818
active_tab_foreground #d3c6aa
inactive_tab_background #1e2524
inactive_tab_foreground #707880

map ctrl+shift+q close_window
map ctrl+shift+f toggle_fullscreen
map f11 toggle_fullscreen
